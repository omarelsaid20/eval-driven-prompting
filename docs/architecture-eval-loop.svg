<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The eval loop</title>
  <desc>Twenty eval cases feed run.ts, which runs one chain per version from v0 to v3. score.ts checks shape, routing and no false decision in code and writes a review page. A person reads the review to score facts. Both feed the score log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" rx="12" fill="#FFFFFF"/>

  <g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="68" x2="198" y2="68"/>
    <line x1="330" y1="68" x2="348" y2="68"/>
    <line x1="480" y1="68" x2="498" y2="68"/>
    <line x1="415" y1="96" x2="415" y2="150"/>
    <path d="M480 180 L565 180 L565 98"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="50" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
    <text x="115" y="58" font-size="14" font-weight="600" fill="#2C2C2A">Eval cases</text>
    <text x="115" y="78" font-size="12" fill="#5F5E5A">20 tickets</text>

    <rect x="200" y="40" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
    <text x="265" y="58" font-size="14" font-weight="600" fill="#3C3489">run.ts</text>
    <text x="265" y="78" font-size="12" fill="#534AB7">v0 to v3 chains</text>

    <rect x="350" y="40" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
    <text x="415" y="58" font-size="14" font-weight="600" fill="#3C3489">score.ts</text>
    <text x="415" y="78" font-size="12" fill="#534AB7">3 code checks</text>

    <rect x="500" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
    <text x="565" y="58" font-size="14" font-weight="600" fill="#2C2C2A">Score log</text>
    <text x="565" y="78" font-size="12" fill="#5F5E5A">One line a version</text>

    <rect x="350" y="152" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
    <text x="415" y="170" font-size="14" font-weight="600" fill="#712B13">Facts by hand</text>
    <text x="415" y="190" font-size="12" fill="#993C1D">Reads review.md</text>
  </g>

  <g font-size="12" fill="#444441">
    <rect x="50" y="160" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
    <text x="70" y="171">Code</text>
    <rect x="50" y="184" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
    <text x="70" y="195">Person</text>
  </g>
</svg>
